name: Linux hardware WebGL probe

on:
  pull_request:
    paths:
      - '.github/workflows/linux-hardware-webgl-probe.yml'
      - 'scripts/linux-hardware-webgl-probe.ts'
      - 'scripts/lib/linux-hardware-webgl-probe.ts'
      - 'tests/linux-hardware-webgl-probe.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # The public GitHub repository remains canonical. This diagnostic canary
    # deliberately executes only on its Gitea pull mirror, where the reviewed
    # Linux GPU label exposes renderD128 to the disposable job container.
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-24.04-gpu
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install --no-install-recommends --yes mesa-vulkan-drivers
      - run: test -c /dev/dri/renderD128
      - run: pnpm build
      - name: Run fresh-browser matrix under Xvfb with Chromium launch logging
        env:
          DEBUG: pw:browser
        run: xvfb-run -a node --experimental-strip-types scripts/linux-hardware-webgl-probe.ts
