name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # This deliberately authorized upstream-collaborator token is scoped
          # to this repository's encrypted Actions secrets. It lets
          # release-please create the release PR even when the organization
          # keeps the default GITHUB_TOKEN read-only for workflow safety.
          token: ${{ secrets.AGENTIC_GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    # Runs as a dependent job in the SAME workflow run as release-please,
    # not a separate run triggered by the `release` event -- a release
    # created with the default GITHUB_TOKEN does not trigger a new
    # workflow run (GitHub's recursive-run guard), so a separate
    # `on: release` workflow would never actually fire.
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # id-token is what lets npm verify build provenance and, once trusted
      # publishing is configured for this repository, publish without a
      # long-lived token at all.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Publish
        # AGENTIC_NPM_TOKEN bootstraps releases until npm trusted publishing
        # (OIDC) is configured for this repository, after which this secret
        # can be removed while id-token continues to provide provenance.
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AGENTIC_NPM_TOKEN }}
