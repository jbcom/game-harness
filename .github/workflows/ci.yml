name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # npm 10's optional-peer resolver crashes while assembling the Vitest consumer.
      - run: npm install --global npm@11.21.0 --ignore-scripts --userconfig /dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # `verify` already ran the package-boundary smoke against the oldest
      # supported Vitest (4.1.10); prove the newest supported major as well.
      - name: Read development Vitest version
        run: node -e "const fs = require('node:fs'); const pkg = require('./package.json'); fs.appendFileSync(process.env.GITHUB_ENV, 'GAME_HARNESS_CONSUMER_VITEST=' + pkg.devDependencies.vitest + '\n');"
      - name: Package boundaries with Vitest 5
        run: pnpm run test:package

  chromium:
    # Real headed Chromium checks of the launch profile (background-tab
    # timer scheduling). Kept out of `pnpm verify` so publishing never
    # depends on a browser download or a display.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm test:chromium

  docs-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter game-harness-docs validate

  portability:
    name: Node 26 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  gate:
    name: CI / gate
    needs: [verify, chromium, docs-site, portability]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native validation job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          DOCS_RESULT: ${{ needs.docs-site.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
        run: |
          for result in "$VERIFY_RESULT" "$CHROMIUM_RESULT" "$DOCS_RESULT" "$PORTABILITY_RESULT"; do
            test "$result" = success || test "$result" = skipped || exit 1
          done
