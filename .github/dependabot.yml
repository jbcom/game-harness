version: 2
updates:
  # One entry for the whole pnpm workspace. The lockfile lives at the root, so
  # Dependabot must run there to cover the docs workspace member and keep
  # pnpm-lock.yaml in step with docs/package.json. A separate /docs entry bumps
  # docs/package.json alone and leaves the root lockfile stale.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node stays on the fleet's Node 24 major instead of tracking the
      # newest release; its majors are raised deliberately, fleet-wide.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
