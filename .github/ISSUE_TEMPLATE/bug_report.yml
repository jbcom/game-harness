name: Bug report
description: Report reproducible incorrect behavior in the package or CLI.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make game-harness more reliable.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a repository or provide the smallest config and command that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: game-harness version
      placeholder: 0.4.3
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node, pnpm or npm, Playwright, Vitest, and browser versions as applicable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and private URLs before pasting output.
      render: text
