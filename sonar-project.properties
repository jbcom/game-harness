# SonarQube Cloud project metadata. SONAR_TOKEN is supplied exclusively by an
# encrypted GitHub Actions secret provisioned from Doppler; never commit it.
sonar.organization=jbcom
sonar.projectKey=jbcom_game-harness
sonar.projectName=game-harness

# This library's release artifact is built from src/. Test, generated, and
# documentation sources remain outside the maintainability denominator.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.exclusions=**/dist/**,**/coverage/**,**/node_modules/**,**/*.d.ts
sonar.coverage.exclusions=tests/**,**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.links.homepage=https://jonbogaty.com/game-harness/
sonar.links.scm=https://github.com/jbcom/game-harness
sonar.links.ci=https://github.com/jbcom/game-harness/actions
