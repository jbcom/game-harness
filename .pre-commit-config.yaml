repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: prettier-check
        name: prettier --check
        entry: pnpm exec prettier --check
        language: system
        types_or: [ts, tsx, javascript, json, yaml, markdown]
        exclude: ^(dist/|coverage/|pnpm-lock\.yaml)

      - id: oxlint
        name: oxlint
        entry: pnpm exec oxlint --deny-warnings
        language: system
        types_or: [ts, tsx, javascript]
        pass_filenames: false
        files: ^(src|tests|scripts)/
